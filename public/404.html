<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/static/style.css"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/fx.css"><title>Page not found | Xploit Unblocker</title>
<style>.lost{min-height:100vh;display:grid;place-content:center;text-align:center;gap:14px;padding:24px}
.lost h1{font:600 clamp(64px,16vw,140px)/1 var(--font-pixel);text-shadow:4px 4px 0 rgba(8,9,24,.6);animation:fxWipe 1s steps(12) backwards}
.lost p{color:var(--text-secondary);max-width:44ch;margin:auto}.lost .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big-moon{width:84px;height:84px;margin:0 auto;border-radius:50%;box-shadow:inset -22px -14px 0 0 #fff4ec,0 0 60px rgba(255,244,236,.3);animation:fxBreath 5s ease-in-out infinite}</style></head>
<body><main class="lost"><div class="big-moon" aria-hidden="true"></div><h1>404</h1>
<p>This page doesn't exist or has moved. Head back to the console or check the docs.</p>
<div class="row"><a class="btn-hero-primary" href="/">Open console</a><a class="btn-hero-secondary" href="/guide/">Read the docs</a></div></main>
<script src="/static/fx.js" defer></script></body></html>
